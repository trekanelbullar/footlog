[project]
name = "ai-hackathon-team-a"
version = "0.1.0"
description = "Team A's AI Hackathon project using Orca Router"
readme = "README.md"
requires-python = "==3.13.15"
dependencies = [
    "openai>=1.68,<3",
    "pydantic-settings>=2.8,<3",
]

[project.scripts]
ai-hackathon = "ai_hackathon_team_a.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_hackathon_team_a"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
